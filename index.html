<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rate a movie</title>
    <style>
        body {
            background-color:aqua;
            font-family: sans-serif;
        }
    </style>
</head>
<body>
    <h1>Rate a movie</h1>
    <img src="https://th.bing.com/th/id/OIP.q8l2E8Z2mtb_VUNTLE4IYAHaH5?r=0&o=7rm=3&rs=1&pid=ImgDetMain&o=7&rm=3">
    <form></form>
    <label for="movietitle">Title of the movie</label>
    <input type="text" id="movie" name="movie" placeholder="Write the title">
    <br>
    <label for="genre"><b>Genre of the movie</b></label>
    <input type="checkbox" id="action" name="action" value="action">
    <label for="action">Action</label>
    <input type="checkbox" id="horror" name="horror" value="horror">
    <label for="horror">Horror</label>
    <input type="checkbox" id="romance" name="romance" value="romance">
    <label for="romance">Romance</label>
    <input type="checkbox" id="comedy" name="comedy" value="comedy">
    <label for="comedy">Comedy</label>
    <br>
    <label for="rating">Rating</label>
    <input type="radio" id="⭐" name="rating" value="1">
    <label for="⭐">⭐</label>
    <input type="radio" id="⭐⭐" name="rating" value="2">
    <label for="⭐⭐">⭐⭐</label>
    <input type="radio" id="⭐⭐⭐" name="rating" value="3">
    <label for="⭐⭐⭐">⭐⭐⭐</label>
    <input type="radio" id="⭐⭐⭐⭐" name="rating" value="4">
    <label for="⭐⭐⭐⭐">⭐⭐⭐⭐</label>
    <input type="radio" id="⭐⭐⭐⭐⭐" name="rating" value="5">
    <label for="⭐⭐⭐⭐⭐">⭐⭐⭐⭐⭐</label>
    <br>
    <label for="review">Review of the movie</label>
    <textarea id="review" name="review" rows="4" cols="50" placeholder="Kindly share your thoughts about the movie"></textarea>
    <br>
    <input type="submit" value="submit">
    </form>
    </body>
</html>
